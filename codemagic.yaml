workflows:
  android-workflow:
    name: Android Debug APK Workflow
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 17
    scripts:
      - name: Build Android Debug APK
        script: |
          cd android/VivoPhotoApp
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/VivoPhotoApp/app/build/outputs/apk/**/*.apk
