workflows:
  android-workflow:
    name: Android Debug APK Workflow
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 17
    scripts:
      - name: Build Android Debug APK
        script: |
          cd android/VivoPhotoApp
          mkdir -p gradle/wrapper
          curl -s -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/VivoPhotoApp/app/build/outputs/apk/**/*.apk
